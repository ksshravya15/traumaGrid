version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traumagrid-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./traumagrid.db
      - INJURY_MODEL_PATH=/app/models/injury_detector.onnx
    volumes:
      - ./backend/traumagrid.db:/app/traumagrid.db
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traumagrid-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
